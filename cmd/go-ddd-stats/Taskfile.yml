---
version: "3"

tasks:
  default:
    desc: "go-ddd-stats: Build, test, install"
    deps: [ fix ]
    cmds:
      - go install .
      - go-ddd-stats

  fix:
    desc: "go-ddd-stats: Clean up source tree"
    aliases: ["fmt"]
    cmds:
      - splint fix ./...
      - go fmt ./...
      - go mod tidy
