---
version: "3"

tasks:
  default:
    desc: "Run tests, install indexer"
    cmds:
      - splint fix ./...
      - go fmt ./...
      - go test -count 1 -cover ./...
      - task: install

  install:
    desc: "Install indexer to environment"
    sources:
      - '**.go'
      - 'index.tpl'
    cmds:
      - go install .
